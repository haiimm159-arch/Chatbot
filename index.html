    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ChatBot</title>
        <style>
            .app-container{
                height: 100vh;
                max-width: 500px;
                margin: 0 auto;
                display: flex;
                flex-direction: column;
            }

            .robot-message{
                justify-content: flex-start;
            }

            .user-message{
                justify-content: flex-end;
            }

            .message-row {
                display: flex;
                align-items: center;
                gap: 10px;
                margin-bottom: 15px;
                width: 100%;
            }

            .input-form{
                display: flex;
                justify-content: center;
                width: 100%;
                gap:10px;
            }

            .chatbot-title{
                display: flex;
                justify-content: center;
                font-size: 50px;
                color: green;
            }

            .message-bubble{
                background-color: rgb(238, 238, 238);
                border-radius: 15px;
                padding: 10px 10px;
                max-width: 60%;
            }

            .user-message .message-bubble {
                background-color: rgb(231, 243, 231);
            }

            .chat-input {
                flex: 1;
                padding: 10px 14px;
                font-size: 18px;
                border: 1px solid #19a903;
                border-radius: 20px;
                outline: none;
            }

            .send-button{
                background-color: rgb(5, 144, 5);
                color: white;
                padding: 8px 12px;
                border-radius: 20px;
                font-size: 20px;
                border: none;
                cursor: pointer;
            }
            .messages-container{
                flex: 1;
                overflow-y: auto;
            }
        </style>    
    </head>
    <body style="font-family: Arial, Helvetica, sans-serif;">
        <div class="js-container"></div>

        <script src="https://unpkg.com/supersimpledev/react.js"></script>
        <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

        <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>


        <script src="https://unpkg.com/supersimpledev/babel.js"></script>
        <script type="text/babel">
        function ChatInput({chatMessages, setChatMessages}) {
            const [chatInput, setChatInput] = React.useState('')
            const inputRef = React.useRef(null);

            function handleInputTextEvent(event) {
                setChatInput(event.target.value);
            }

            function sendMessage (event) {
                event.preventDefault();
                if(chatInput.trim() === '') return;
                setChatMessages([
                    ...chatMessages,
                    {
                        sender: 'user',
                        message: chatInput,
                        id: crypto.randomUUID()
                    }
                ])
                setChatInput('');
                inputRef.current.focus();

                const response = Chatbot.getResponse(chatInput);
                setChatMessages((previouseChatMessages) => {
                    return [
                        ...previouseChatMessages,
                        {
                            sender: 'robot',
                            message: response,
                            id: crypto.randomUUID()
                        }
                    ]
                })
            }

            return(               
                <form 
                    className='input-form' 
                    onSubmit={sendMessage} 
                    type="submit"
                >
                    <input 
                        value={chatInput}
                        onChange={handleInputTextEvent} 
                        ref={inputRef}
                        className='chat-input'
                        size="30" 
                    />
                    <button className='send-button'>Send</button>
                </form>
            )
        }

        function ChatMessage({ message, sender }) {
            return (
                <div className={`message-row ${
                    sender === 'robot' ? 'robot-message' : 'user-message'}`
                }>
                    {
                        sender === 'robot' && 
                        <img 
                            width="50"
                            src ="./images/robot.png" 
                        />
                    }
                    <span className='message-bubble'>
                        {message}           
                    </span>
                    { 
                        sender === 'user' &&
                        <img 
                            width="50"
                            src="./images/user.png" 
                        />
                    }

                </div>
            )
        }
        
        function ChatMessages({chatMessages}) {
            const bottomRef = React.useRef(null);
            React.useEffect(() => {
                bottomRef.current.scrollIntoView()
            },[chatMessages]);

            return (
                <div className="messages-container">
                    {chatMessages.map((chatMessage) => {
                        return (<ChatMessage 
                            sender={chatMessage.sender}
                            message={chatMessage.message}
                            key={chatMessage.id}
                        />)
                    })}

                    <div ref={bottomRef} />
                </div>
            );
        }


        function App() { 
            const [chatMessages, setChatMessages] = React.useState([{
                sender:'robot',
                message:'Hello, how can I help you today? :)',
                id: crypto.randomUUID()
            }]);

            return (
                <div className="app-container">
                    <h1 className="chatbot-title">ChatBot</h1>
                    <ChatMessages
                        chatMessages={chatMessages} 
                    />

                    <ChatInput
                        chatMessages={chatMessages}
                        setChatMessages={setChatMessages} 
                    />
                </div>
          )  
        }

        const container = document.querySelector('.js-container');
        ReactDOM.createRoot(container).render(<App />);
        </script>
    </body>
    </html>
