    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ChatBot</title>
        <style>
            body {
                font-family: Arial, Helvetica, sans-serif;
                margin-top: 0px;
                margin-bottom: 0px;
            }

            .app-container{
                height: 100vh;
                max-width: 500px;
                margin: 0 auto;
                display: flex;
                flex-direction: column;
            }

            .robot-message{
                justify-content: flex-start;
            }

            .user-message{
                justify-content: flex-end;
            }

            .message-row {
                display: flex;
                align-items: center;
                gap: 10px;
                margin-bottom: 15px;
                width: 100%;
            }

            .input-form{
                display: flex;
                justify-content: center;
                width: 100%;
                gap:10px;
                margin-bottom: 60px;
            }

            .chatbot-title{
                display: flex;
                justify-content: center;
                font-size: 50px;
                color: green;
            }

            .message-bubble{
                background-color: rgb(238, 238, 238);
                border-radius: 15px;
                padding: 10px 10px;
                max-width: 60%;
            }

            .user-message .message-bubble {
                background-color: rgb(231, 243, 231);
            }

            .chat-message-profile {
                width: 45px;
            }

            .chat-input {
                flex: 1;
                padding: 10px 14px;
                font-size: 18px;
                border: 1px solid #19a903;
                border-radius: 20px;
                outline: none;
            }

            .send-button{
                background-color: rgb(5, 144, 5);
                color: white;
                padding: 8px 12px;
                border-radius: 20px;
                font-size: 20px;
                border: none;
                cursor: pointer;
            }
            .messages-container{
                flex: 1;
                overflow-y: auto;
                scrollbar-width: none;
                margin-top: 10px;
            }

            .send-button:disabled {
                background-color: gray;
                cursor: not-allowed;
                opacity: 0.6;
            }

            .loading-gif {
                width: 60px;
                height: 60px;
                display: block;
                margin-left: -5px;
            }

            .loading-message {
                background-color: transparent;
                padding: 0;
            }
        </style>    
    </head>
    <body>
        <div class="js-container"></div>

        <script src="https://unpkg.com/supersimpledev/react.js"></script>
        <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

        <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>


        <script src="https://unpkg.com/supersimpledev/babel.js"></script>
        <script type="text/babel">

        function ChatInput({chatMessages, setChatMessages}) {
            const [chatInput, setChatInput] = React.useState('');
            const [isLoading, setIsLoading] = React.useState(false);
            const inputRef = React.useRef(null);

            function handleInputTextEvent(event) {
                setChatInput(event.target.value);
            }

            function handleEscapeInputEvent(event) {
                if (event.key === 'Escape') {
                  setChatInput('')  
                }
            }

            async function sendMessage (event) {
                event.preventDefault();
                if(chatInput.trim() === '' || isLoading === true) return;
                const loadingId = crypto.randomUUID();

                setIsLoading(true);

                setChatMessages([
                    ...chatMessages,
                    {
                        sender: 'user',
                        message: chatInput,
                        id: crypto.randomUUID()
                    },
                    {
                        sender: 'robot',
                        message: 'Loading...',
                        isLoading: true,
                        id: loadingId
                    }
                ]);

                setChatInput('');
                inputRef.current.focus();

                let response;
                try {
                    response =  await Chatbot.getResponseAsync(chatInput);
                } catch(error) {
                    console.error(error)
                    response = 'Sorry, something went wrong, please try again later.'
                } finally {
                    setIsLoading(false);
                }

                setChatMessages((previouseChatMessages) => 
                    previouseChatMessages.map((chatMessage) => {
                        if (chatMessage.id === loadingId) {
                            return {
                                ...chatMessage,
                                message: response,
                                isLoading: false 
                            } 
                        }
                        return chatMessage;
                    }) 
                )
            }

            return(               
                <form 
                    className='input-form' 
                    onSubmit={sendMessage} 
                >
                    <input 
                        value={chatInput}
                        onChange={handleInputTextEvent} 
                        ref={inputRef}
                        onKeyDown={handleEscapeInputEvent}
                        className='chat-input'
                        size="30" 
                    />
                    <button 
                        className='send-button'
                        disabled={isLoading}
                        type="submit"
                            >Send
                    </button>
                </form>
            )
        }

        function ChatMessage({ message, sender, isLoading }) {
            return (
                <div className={`message-row ${
                    sender === 'robot' ? 'robot-message' : 'user-message'}`
                }>
                    {
                        sender === 'robot' && 
                        <img 
                            className= "chat-message-profile"
                            src ="./images/robot.png" 
                        />
                    }
                    <span className= {`message-bubble ${
                            isLoading ? 'loading-message' : ''
                        }`}
                    >
                        {
                            isLoading 
                            ? (<img
                                src="images/loading2.gif"
                                className="loading-gif"
                                alt="loading"
                            />
                            ) : (
                                message          
                            )
                        }
                    </span>
                    { 
                        sender === 'user' &&
                        <img 
                            className="chat-message-profile"
                            src="./images/user.png" 
                        />
                    }

                </div>
            )
        }
        
        function ChatMessages({chatMessages}) {
            const bottomRef = React.useRef(null);
            React.useEffect(() => {
                bottomRef.current.scrollIntoView(
                    {behavior: 'smooth'}
                )
            },[chatMessages]);

            return (
                <div className="messages-container">
                    {chatMessages.map((chatMessage) => {
                        return (<ChatMessage 
                            sender={chatMessage.sender}
                            message={chatMessage.message}
                            isLoading={chatMessage.isLoading}
                            key={chatMessage.id}
                        />)
                    })}

                    <div ref={bottomRef} />
                </div>
            );
        }


        function App() { 
            const [chatMessages, setChatMessages] = React.useState([{
                sender:'robot',
                message:'Hello, how can I help you today? :)',
                id: crypto.randomUUID()
            }]);

            return (
                <div className="app-container">
                    <h1 className="chatbot-title">ChatBot - AI Assistant</h1>
                    <ChatMessages
                        chatMessages={chatMessages} 
                    />

                    <ChatInput
                        chatMessages={chatMessages}
                        setChatMessages={setChatMessages} 
                    />
                </div>
          )  
        }

        const container = document.querySelector('.js-container');
        ReactDOM.createRoot(container).render(<App />);
        </script>
    </body>
    </html>
